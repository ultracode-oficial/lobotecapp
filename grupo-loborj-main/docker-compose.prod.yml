services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4006:80"
    restart: unless-stopped
    env_file:
      - ./frontend/.env

  backend:
    build: ./backend
    ports:
      - "4007:80"
      - "4008:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    volumes:
      - /filestorages_lobotec:/filestorages_lobotec
    env_file:
      - ./backend/.env

  redis:
    image: "redis:alpine"
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - "redis_lobotec:/data"
    env_file:
      - ./backend/.env
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      retries: 3
      timeout: 5s
    restart: unless-stopped

volumes:
  redis_lobotec:
